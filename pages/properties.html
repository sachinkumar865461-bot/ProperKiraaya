<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Properties | ProperKiraaya</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="../css/properties.css">
    <style>


/* =========================
   GLOBAL STYLING
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: #f8fafc;
    color: #1e293b;
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}


/* =========================
   NAVBAR
========================= */

.navbar {
    width: 100%;
    min-height: 75px;
    padding: 15px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #ffffff;
    box-shadow: 0 2px 15px rgba(0, 0, 0, 0.06);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    color: #0f766e;
    letter-spacing: -1px;
}

.navbar nav {
    display: flex;
    align-items: center;
    gap: 32px;
}

.navbar nav a {
    font-size: 15px;
    font-weight: 600;
    color: #334155;
    transition: 0.3s;
}

.navbar nav a:hover {
    color: #0f766e;
}


/* =========================
   HERO SECTION
========================= */

.hero {
    min-height: 340px;
    padding: 80px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(135deg, #0f766e, #134e4a);
    color: #ffffff;
}

.hero h1 {
    font-size: 42px;
    font-weight: 800;
    margin-bottom: 15px;
}

.hero p {
    font-size: 17px;
    max-width: 600px;
    color: #d1fae5;
}


/* =========================
   SEARCH SECTION
========================= */

.search-section {
    width: 85%;
    max-width: 1100px;
    margin: -35px auto 60px;
    padding: 25px;
    background-color: #ffffff;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
}

.search-section input,
.search-section select {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
    background-color: #ffffff;
    color: #334155;
}

.search-section input:focus,
.search-section select:focus {
    border-color: #0f766e;
}

.search-section button {
    padding: 15px 25px;
    border: none;
    border-radius: 8px;
    background-color: #0f766e;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

.search-section button:hover {
    background-color: #115e59;
    transform: translateY(-2px);
}


/* =========================
   PROPERTIES SECTION
========================= */

.properties-section {
    width: 85%;
    max-width: 1200px;
    margin: 0 auto 80px;
}

.properties-section h2 {
    font-size: 30px;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 8px;
}

.properties-section > p {
    font-size: 15px;
    color: #64748b;
    margin-bottom: 30px;
}


/* =========================
   PROPERTY CONTAINER
========================= */

.property-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}


/* =========================
   PROPERTY CARD
========================= */

.property-card {
    background-color: #ffffff;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
    transition: 0.3s ease;
}

.property-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.10);
}

.property-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.property-info {
    padding: 20px;
}

.property-info h3 {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #1e293b;
}

.property-info .location {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 12px;
}

.property-info .price {
    font-size: 22px;
    font-weight: 800;
    color: #0f766e;
}

.property-info button {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: #0f766e;
    color: #ffffff;
    font-weight: 700;
    cursor: pointer;
}

.property-info button:hover {
    background-color: #115e59;
}


/* =========================
   FOOTER
========================= */

footer {
    background-color: #0f172a;
    color: #ffffff;
    text-align: center;
    padding: 40px 20px;
}

footer h3 {
    font-size: 25px;
    color: #5eead4;
    margin-bottom: 10px;
}

footer p {
    font-size: 14px;
    color: #cbd5e1;
    margin-top: 8px;
}


/* =========================
   RESPONSIVE DESIGN
========================= */

@media (max-width: 900px) {

    .property-container {
        grid-template-columns: repeat(2, 1fr);
    }

    .search-section {
        flex-wrap: wrap;
    }

    .search-section input,
    .search-section select {
        flex: 1 1 40%;
    }

    .search-section button {
        flex: 1 1 100%;
    }

}

@media (max-width: 600px) {

    .navbar {
        padding: 15px 5%;
        flex-direction: column;
        gap: 15px;
    }

    .navbar nav {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .logo {
        font-size: 24px;
    }

    .hero {
        min-height: 280px;
        padding: 60px 20px;
    }

    .hero h1 {
        font-size: 29px;
    }

    .hero p {
        font-size: 14px;
    }

    .search-section {
        width: 90%;
        padding: 18px;
        flex-direction: column;
        margin-top: -25px;
    }

    .search-section input,
    .search-section select,
    .search-section button {
        width: 100%;
        flex: auto;
    }

    .properties-section {
        width: 90%;
    }

    .properties-section h2 {
        font-size: 25px;
    }

    .property-container {
        grid-template-columns: 1fr;
    }

}

    </style>

</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            ProperKiraaya
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="properties.html">Properties</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </nav>

    </header>


    <!-- Hero Section -->
    <section class="hero">

        <h1>Find Your Perfect Property</h1>

        <p>
            Discover rooms, flats, houses and PGs
            that match your lifestyle.
        </p>

    </section>


    <!-- Search Section -->
    <section class="search-section">

        <input type="text" placeholder="Enter city or location">

        <select>
            <option value="">Property Type</option>
            <option value="room">Room</option>
            <option value="flat">Flat</option>
            <option value="house">House</option>
            <option value="pg">PG</option>
            <option value="hostel">Hostel</option>
        </select>

        <input type="number" placeholder="Maximum Budget">

        <button type="button">Search Property</button>

    </section>


    <!-- Properties Section -->
    <section class="propertie-section">

        <h2>Available Properties</h2>

        <p>Explore properties available for rent.</p>

        <div class="property-container">

            <!-- Property Cards will come here -->

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <h3>ProperKiraaya</h3>

        <p>Find your perfect place to live.</p>

        <p>© 2026 ProperKiraaya. All Rights Reserved.</p>

    </footer>


    <!-- JavaScript File -->
    <script src="../js/properties.js"></script>

</body>

</html>
