<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup : ProperKiraya</title>
    <style>
      .login-section {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #eef2f7;
        border-radius: 10px;
        border: 2px solid #ccc;
     }
    </style>
</head>
<body>
    <section class="login-section">

        <div class="login-box">

            <h2>Create Account</h2>

            <p>Sign up for your ProperKiraya account</p>

            <form>

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
                <br>

                <button type="submit">Sign Up</button>

            </form>

        </div>

    </section>
    
</body>
</html>
