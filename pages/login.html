<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ProperKiraaya</title>
      <!-- CSS Connection -->
    <!-- <link rel="stylesheet" href="./css/login.css"> this is wrong -->
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <!-- Login Section -->
    <section class="login-container">

        <div class="login-box">

            <!-- Logo -->
            <div class="logo">
                <h2>Proper<span>Kiraaya</span></h2>
            </div>

            <!-- Heading -->
            <h1>Welcome Back!</h1>
            <p class="subtitle">Login to your ProperKiraaya account</p>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter your email address"
                        required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                        required>
                </div>

                <!-- Remember Me and Forgot Password -->
                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Remember Me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <!-- Signup Link -->
            <p class="signup-link">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

            <!-- Back to Home -->
            <a href="../index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>

    <!-- JavaScript File -->
    <script src="../js/login.js"></script>

</body>
</html>
