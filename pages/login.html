<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ProperKiraaya</title>
    <style>
/* Universal Reset */
       * {
       margin: 0;
       padding: 0;
       box-sizing: border-box;
       font-family: Arial, sans-serif;
       }

/* Body */
      body {
      background: #f4f7fb;
      min-height: 100vh;
}

/* Login Container */
      .login-container {
       width: 100%;
       min-height: 100vh;
       display: flex;
       justify-content: center;
       align-items: center;
       padding: 30px 15px;
       }

/* Login Box */
      .login-box {
       width: 100%;
       max-width: 450px;
       background: #ffffff;
       padding: 40px;
       border-radius: 15px;
       box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
       }

/* Logo */
      .logo {
       text-align: center;
       margin-bottom: 25px;
       }

       .logo h2 {
        color: #172554;
        font-size: 28px;
        font-weight: bold;
        }

       .logo span {
        color: #2563eb;
        font-weight: bold;
      }

/* Heading */
       .login-box h1 {
        text-align: center;
        color: #172554;
        font-size: 28px;
        margin-bottom: 10px;
        }

       .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        margin-bottom: 30px;
        }

/* Form Group */
        .form-group {
         margin-bottom: 20px;
        }

       .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
        }

      .form-group input {
       width: 100%;
       padding: 13px 15px;
       border: 1px solid #cbd5e1;
       border-radius: 8px;
       outline: none;
       font-size: 14px;
       transition: 0.3s;
       }

      .form-group input:focus {
       border-color: #2563eb;
       box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
       }

/* Form Options */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #475569;
   }

   .form-options a {
      color: #2563eb;
      text-decoration: none;
   }

   .form-options a:hover {
      text-decoration: underline;
   }

/* Login Button */
   .login-btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

/* Signup Link */
   .signup-link {
      text-align: center;
      margin-top: 25px;
      color: #64748b;
      font-size: 14px;
   }

   .signup-link a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
   }

   .signup-link a:hover {
      text-decoration: underline;
   }

/* Back to Home */
   .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #475569;
      font-size: 14px;
      text-decoration: none;
   }

   .back-home:hover {
    color: #2563eb;
   }

/* Responsive Design */
    @media (max-width: 480px) {

    .login-box {
        padding: 25px 20px;
    }

    .login-box h1 {
        font-size: 24px;
    }

       .logo h2 {
          font-size: 25px;
        }

       .form-options {
         font-size: 12px;
       }
   }
    </style>
</head>

<body>

    <!-- Login Section -->
    <section class="login-container">

        <div class="login-box">

            <!-- Logo -->
            <div class="logo">
                <h2>Proper<span>Kiraaya</span></h2>
            </div>

            <!-- Heading -->
            <h1>Welcome Back!</h1>
            <p class="subtitle">Login to your ProperKiraaya account</p>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter your email address"
                        required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                        required>
                </div>

                <!-- Remember Me and Forgot Password -->
                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Remember Me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <!-- Signup Link -->
            <p class="signup-link">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

            <!-- Back to Home -->
            <a href="../index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>

    <!-- JavaScript File -->
    <script src="../js/login.js"></script>

</body>
</html>
